name: Build

# 编译所有 main 项目的默认目标（矩阵），上传 artifact。
# 矩阵来自各 main/<项目>/build_targets.txt。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---- 生成构建矩阵 ----
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          echo "include=$(bash scripts/gen_matrix.sh)" >> "$GITHUB_OUTPUT"

  # ---- 矩阵构建 ----
  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: ${{ matrix.project }} / ${{ matrix.chip }}
    steps:
      - uses: actions/checkout@v4

      # 缓存 RISC-V 工具链（约 413MB，避免每次下载）
      - name: Cache RISC-V toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: sdk/common/prebuilt/xpack-riscv-none-elf-gcc-15.2.0-1
          key: xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64

      - name: Download RISC-V toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          VERSION=15.2.0-1
          PKG=xpack-riscv-none-elf-gcc-$VERSION
          URL=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$VERSION
          mkdir -p sdk/common/prebuilt
          curl -L --fail -o /tmp/$PKG.tar.gz $URL/$PKG-linux-x64.tar.gz
          tar xzf /tmp/$PKG.tar.gz -C sdk/common/prebuilt
          rm /tmp/$PKG.tar.gz
          sdk/common/prebuilt/$PKG/bin/riscv-none-elf-gcc --version | head -1

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_TOOLCHAIN_FILE=sdk/common/cmake/riscv.cmake \
            -DCHIP_SDK=${{ matrix.chip }}

      - name: Build
        run: cmake --build build --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          BIN=build/main/${{ matrix.target }}/${{ matrix.target }}.bin
          HEX=build/main/${{ matrix.target }}/${{ matrix.target }}.hex
          ELF=build/main/${{ matrix.target }}/${{ matrix.target }}.elf
          [ -f "$BIN" ] && cp "$BIN" out/${{ matrix.target }}-${{ matrix.chip }}.bin
          [ -f "$HEX" ] && cp "$HEX" out/${{ matrix.target }}-${{ matrix.chip }}.hex
          [ -f "$ELF" ] && cp "$ELF" out/${{ matrix.target }}-${{ matrix.chip }}.elf
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.chip }}
          path: out/
          if-no-files-found: error
