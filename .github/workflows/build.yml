name: Build

# 编译全部芯片 × 全部目标（矩阵），上传 artifact。
#
# 新架构（HAL）：
#   - 工具链：sdk/prebuilt/xpack-riscv-none-elf-gcc-15.2.0-1
#   - 构建：cmake -DHAL_BUILD=ON -DCHIP=<chip> -B build_hal
#   - 产物：build_hal/main/<target>/<target>.{bin,hex,elf}
#
# 芯片与目标矩阵由 scripts/gen_matrix.py 生成。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TOOLCHAIN_VERSION: 15.2.0-1

jobs:
  # ---- 生成构建矩阵 ----
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          python3 scripts/gen_matrix.py > /tmp/matrix.json
          cat /tmp/matrix.json
          echo "include=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  # ---- 矩阵构建 ----
  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: ${{ matrix.chip }} / ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # 缓存 RISC-V 工具链（约 400MB，避免每次下载）
      - name: Cache RISC-V toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: sdk/prebuilt/xpack-riscv-none-elf-gcc-${{ env.TOOLCHAIN_VERSION }}
          key: xpack-riscv-none-elf-gcc-${{ env.TOOLCHAIN_VERSION }}-linux-x64

      - name: Download RISC-V toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          PKG=xpack-riscv-none-elf-gcc-${{ env.TOOLCHAIN_VERSION }}
          URL=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.TOOLCHAIN_VERSION }}
          mkdir -p sdk/prebuilt
          curl -L --fail -o /tmp/$PKG.tar.gz $URL/$PKG-linux-x64.tar.gz
          tar xzf /tmp/$PKG.tar.gz -C sdk/prebuilt
          rm /tmp/$PKG.tar.gz
          sdk/prebuilt/$PKG/bin/riscv-none-elf-gcc --version | head -1

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          cmake -B build_hal -G Ninja \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_TOOLCHAIN_FILE=sdk/cmake/toolchain-riscv.cmake \
            -DHAL_BUILD=ON \
            -DCHIP=${{ matrix.chip }}

      - name: Build
        run: cmake --build build_hal --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          D=build_hal/main/${{ matrix.target }}
          T=${{ matrix.target }}
          [ -f "$D/$T.bin" ] && cp "$D/$T.bin" "out/$T-${{ matrix.chip }}.bin"
          [ -f "$D/$T.hex" ] && cp "$D/$T.hex" "out/$T-${{ matrix.chip }}.hex"
          [ -f "$D/$T.elf" ] && cp "$D/$T.elf" "out/$T-${{ matrix.chip }}.elf"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.chip }}
          path: out/
          if-no-files-found: error
