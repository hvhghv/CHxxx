<!doctype html>
<html lang=zh>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>CH59x Gateway · 控制台</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#111827; --panel2:#1a2234; --border:#1f2a3d;
  --fg:#e6edf6; --muted:#8b9bb4; --accent:#3b82f6; --accent-h:#60a5fa;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --radius:12px; --shadow:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--fg); overflow:hidden}
.app{display:grid; grid-template-columns:220px 1fr; height:100vh}
.side{background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 12px; gap:4px}
.brand{display:flex; align-items:center; gap:10px; padding:8px 10px 18px; font-weight:700; font-size:15px}
.brand .logo{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#8b5cf6); display:grid; place-items:center; font-size:15px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--muted); text-decoration:none; font-size:13.5px; cursor:pointer; transition:background .15s,color .15s}
.nav a:hover{background:var(--panel2); color:var(--fg)}
.nav a.on{background:var(--accent); color:#fff}
.nav a .ic{width:16px; text-align:center; opacity:.9}
.nav a .cnt{margin-left:auto; font-size:11px; background:var(--panel2); padding:1px 7px; border-radius:10px; color:var(--muted)}
.nav a.on .cnt{background:rgba(255,255,255,.2); color:#fff}
.side .foot{margin-top:auto; padding:10px; font-size:11px; color:var(--muted); border-top:1px solid var(--border)}
.main{display:flex; flex-direction:column; overflow:hidden}
.top{display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border)}
.top h1{font-size:15px; margin:0; font-weight:600}
.top .sp{flex:1}
.host{display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:4px 8px}
.host input{background:transparent; border:0; color:var(--fg); font-size:13px; width:150px; outline:0; font-family:ui-monospace,monospace}
.status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s}
.dot.on{background:var(--ok); box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--err)}
.dot.wait{background:var(--warn); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1; overflow-y:auto; padding:20px}
.page{display:none; animation:fade .2s}
.page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(6px)}}
.grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.card .hd{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:13px}
.card .hd .ic{color:var(--accent); font-size:15px}
.card .hd .sub{margin-left:auto; font-size:11px; color:var(--muted); font-weight:400}
.card .bd{padding:16px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.row:last-child{margin-bottom:0}
label{font-size:12px; color:var(--muted); min-width:32px}
input,select{background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; outline:0; transition:border-color .15s,box-shadow .15s}
input{width:90px}
input:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.15)}
input[type=file]{font-size:12px; color:var(--muted); width:auto}
.btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer; transition:background .15s,transform .08s}
.btn:hover{background:var(--accent-h)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2); color:var(--fg); border:1px solid var(--border)}
.btn.ghost:hover{background:var(--border)}
.btn.sm{padding:4px 10px; font-size:12px}
.btn.danger{background:var(--err)}
.btn.on{background:var(--ok)}
.out{background:#070b14; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-top:12px; font:12px/1.5 ui-monospace,'Cascadia Code',Consolas,monospace; color:#7dd3fc; white-space:pre-wrap; word-break:break-word; min-height:22px; max-height:200px; overflow:auto}
.out.err{color:#fca5a5}
/* 引脚表格 */
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border)}
th{color:var(--muted); font-weight:500; font-size:12px}
td select{width:110px}
td input{width:64px}
tr:last-child td{border-bottom:0}
tr.used td{background:rgba(59,130,246,.05)}
.pinname{font-family:ui-monospace,monospace; color:var(--fg); font-weight:600}
td.caps{font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; max-width:140px}
/* GPIO 控制项 */
.ctrl{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border)}
.ctrl:last-child{border-bottom:0}
.ctrl .name{font-family:ui-monospace,monospace; font-weight:600; min-width:44px}
.ctrl .val{margin-left:auto; font-family:ui-monospace,monospace; color:#7dd3fc}
/* 概览：键值对 */
.kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600; font-family:ui-monospace,monospace}
/* 概览：统计块 */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 8px; text-align:center}
.stat .sic{font-size:18px; color:var(--accent); margin-bottom:4px}
.stat .sv{font-size:22px; font-weight:700; font-family:ui-monospace,monospace}
.stat .sn{font-size:11px; color:var(--muted); margin-top:2px}
/* 引脚复用：Tab 切换 */
.tabs{display:flex; gap:4px; padding:10px 16px 0; border-bottom:1px solid var(--border)}
.tabs a{padding:8px 14px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:color .15s,border-color .15s}
.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--accent); border-bottom-color:var(--accent)}
/* 引脚复用：按外设手风琴（Accordion 卡片，借鉴 AWS 控制台 / Bootstrap Accordion） */
.pmacc{padding:12px 16px 16px; display:flex; flex-direction:column; gap:8px}
.acc{background:var(--panel2); border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:border-color .15s}
.acc.open{border-color:var(--accent)}
.acc-hd{display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; user-select:none; transition:background .12s; min-height:48px}
.acc-hd:hover{background:rgba(255,255,255,.03)}
.acc-hd .caret{color:var(--muted); font-size:11px; transition:transform .2s; width:10px; flex-shrink:0}
.acc.open .caret{transform:rotate(90deg)}
.acc-hd .ic{color:var(--accent); font-size:15px; width:18px; text-align:center; flex-shrink:0}
.acc-hd .nm{font-family:ui-monospace,monospace; font-weight:600; font-size:14px; flex-shrink:0}
.acc-hd .cat{font-size:11px; color:var(--muted); background:var(--bg); padding:1px 8px; border-radius:10px; flex-shrink:0}
.acc-hd .pins{margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; align-items:center}
.acc-hd .cnt{font-size:11px; color:var(--muted); min-width:52px; text-align:right; flex-shrink:0}
.acc-bd{border-top:1px solid var(--border); padding:4px 16px 6px}
.acc-row{display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--border)}
.acc-row:first-child{padding-top:8px}
.acc-row:last-child{border-bottom:0; padding-bottom:8px}
.acc-row .sig{min-width:110px; display:flex; flex-direction:column; gap:1px}
.acc-row .sig b{font-size:13px; font-weight:600}
.acc-row .sig span{font-family:ui-monospace,monospace; font-size:10.5px; color:var(--muted)}
.acc-row .used{flex:1; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.acc-row .add{white-space:nowrap; display:flex; gap:6px; align-items:center}
.acc-row .add select{width:auto; font-size:12px; padding:5px 8px}
/* UART 参数配置行 */
.uartcfg{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 12px; background:var(--bg); border-radius:8px; margin:6px 0 2px}
.uartcfg .uc-label{font-size:11px; color:var(--muted); font-weight:600}
.uartcfg label{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted)}
.uartcfg select{width:auto; font-size:12px; padding:4px 8px}
.pmempty{color:var(--muted); text-align:center; padding:40px 20px; font-size:13px}
.chip{display:inline-flex; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-size:12px; font-family:ui-monospace,monospace}
.chip a{color:var(--muted); cursor:pointer; font-size:14px; line-height:1; text-decoration:none}
.chip a:hover{color:var(--err)}
.muted{color:var(--muted); font-size:12px}
/* Toast */
#toasts{position:fixed; top:16px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:100}
.toast{background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:10px 14px; font-size:13px; box-shadow:var(--shadow); animation:slide .25s; max-width:320px}
.toast.err{border-left-color:var(--err)} .toast.ok{border-left-color:var(--ok)}
@keyframes slide{from{opacity:0; transform:translateX(20px)}}
.empty{color:var(--muted); font-size:13px; padding:16px 0; text-align:center}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#2d3a52}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.host input{width:110px}}
</style>
</head>
<body>
<div class=app>
  <aside class=side>
    <div class=brand><span class=logo>⚡</span>CH59x Gateway</div>
    <nav class=nav id=nav></nav>
    <div class=foot>WCH RISC-V · BLE + USB + LWIP</div>
  </aside>
  <div class=main>
    <div class=top>
      <h1 id=title>控制台</h1>
      <span class=sp></span>
      <div class=host><span style="font-size:12px;color:var(--muted)">设备</span><input id=host value="http://192.168.7.1" spellcheck=false></div>
      <button class="btn ghost" onclick=connect()>连接</button>
      <div class=status><span class="dot" id=dot></span><span id=statustxt>未连接</span></div>
    </div>
    <div class=content id=content></div>
  </div>
</div>
<div id=toasts></div>

<script>
const $=id=>document.getElementById(id);
const V=id=>$(id).value;
const H=()=>{
  const q=new URLSearchParams(location.search).get('host');
  if(q){localStorage.setItem('gw_host',q); return q.replace(/\/$/,'')}
  return (localStorage.getItem('gw_host')||$('host').value||'http://192.168.7.1').replace(/\/$/,'');
};
function setStatus(s){
  $('dot').className='dot '+(s==='on'?'on':s==='off'?'off':'wait');
  $('statustxt').textContent=s==='on'?'已连接':s==='off'?'连接失败':'连接中…';
}
function toast(msg,type){
  const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300)},3000);
}
async function api(path,method,body){
  setStatus('wait');
  const r=await fetch(H()+path,method?{method,body}:undefined);
  const t=await r.text(); setStatus('on'); return t;
}
async function call(outId,path,method){
  try{ const t=await api(path,method); if(outId){$(outId).textContent=t; $(outId).classList.remove('err')} return t; }
  catch(e){ if(outId){$(outId).textContent='错误: '+e.message; $(outId).classList.add('err')} setStatus('off'); toast('请求失败: '+e.message,'err'); }
}
function connect(){ localStorage.setItem('gw_host',V('host').replace(/\/$/,'')); refreshPins().then(()=>toast('已连接设备','ok')); }

/* ---------- 引脚配置模型 ---------- */
/* 功能列表（含外设实例：UART0-3、SPI0、I2C） */
const FUNCS=['NONE','GPIO_IN','GPIO_OUT','SWIO',
  'UART0_TX','UART0_RX','UART1_TX','UART1_RX','UART2_TX','UART2_RX','UART3_TX','UART3_RX',
  'SPI0_MOSI','SPI0_MISO','SPI0_SCK','SPI0_SCS','I2C_SCL','I2C_SDA','PWM','ADC'];
/* 功能中文名（用于显示） */
const FUNC_CN={NONE:'未使用',GPIO_IN:'GPIO 输入',GPIO_OUT:'GPIO 输出',SWIO:'SWIO 烧录',
  UART0_TX:'UART0 TX',UART0_RX:'UART0 RX',UART1_TX:'UART1 TX',UART1_RX:'UART1 RX',
  UART2_TX:'UART2 TX',UART2_RX:'UART2 RX',UART3_TX:'UART3 TX',UART3_RX:'UART3 RX',
  SPI0_MOSI:'SPI0 MOSI',SPI0_MISO:'SPI0 MISO',SPI0_SCK:'SPI0 SCK',SPI0_SCS:'SPI0 SCS',
  I2C_SCL:'I2C SCL',I2C_SDA:'I2C SDA',PWM:'PWM',ADC:'ADC'};
/* 外设树：大类 → 实例 → 信号
 * 用于「按外设」视图：先选大类（GPIO/UART/SPI...），展开后选实例（UART0/UART1...），
 * 再展开显示该实例的各信号（TX/RX/MOSI...）
 * 结构：[{cat:大类中文名, ic:图标, insts:[{name:实例名, sigs:[[功能, 信号短名]...]}]}] */
const TREE=[
  {cat:'GPIO', ic:'⚙', insts:[{name:'GPIO', sigs:[['GPIO_IN','输入'],['GPIO_OUT','输出']]}]},
  {cat:'UART', ic:'⇄', insts:[
    {name:'UART0', sigs:[['UART0_TX','TX'],['UART0_RX','RX']]},
    {name:'UART1', sigs:[['UART1_TX','TX'],['UART1_RX','RX']]},
    {name:'UART2', sigs:[['UART2_TX','TX'],['UART2_RX','RX']]},
    {name:'UART3', sigs:[['UART3_TX','TX'],['UART3_RX','RX']]},
  ]},
  {cat:'SPI', ic:'▤', insts:[
    {name:'SPI0', sigs:[['SPI0_MOSI','MOSI'],['SPI0_MISO','MISO'],['SPI0_SCK','SCK'],['SPI0_SCS','SCS']]},
  ]},
  {cat:'I2C', ic:'◇', insts:[
    {name:'I2C', sigs:[['I2C_SCL','SCL'],['I2C_SDA','SDA']]},
  ]},
  {cat:'PWM', ic:'▥', insts:[{name:'PWM', sigs:[['PWM','PWM']]}]},
  {cat:'ADC', ic:'◈', insts:[{name:'ADC', sigs:[['ADC','ADC']]}]},
  {cat:'SWIO', ic:'⬇', insts:[{name:'SWIO', sigs:[['SWIO','SWIO']]}]},
];
let PINS=[];   // [{name,func,p1,p2,arg}]
const byFunc=f=>PINS.filter(p=>p.func===f);
const funcCN=f=>FUNC_CN[f]||f;

/* 引脚能力表（据 CH592/CH591 数据手册 V1.9 引脚复用表）
 * 每项：引脚名 → 支持的外设实例集合（GPIO_IN/OUT/SWIO 所有引脚都支持）
 * 命名：UARTn_TX/RX（n=0..3）、SPI0_MOSI/MISO/SCK/SCS、I2C_SCL/SDA
 * 无下划线=默认映射，有下划线=重映射（如 TXD0_ 是 UART0 的 TX 重映射到 PA14） */
const PIN_CAPS={
  PA4:['UART3_RX','ADC'],                    // RXD3, AIN0
  PA5:['UART3_TX','ADC'],                    // TXD3, AIN1
  PA6:['PWM','UART2_RX','ADC'],              // PWM4_, RXD2_, AIN10
  PA7:['UART2_TX','PWM','ADC'],              // TXD2_, PWM5_, AIN11
  PA8:['UART1_RX','ADC'],                    // RXD1, AIN12
  PA9:['UART1_TX','PWM','ADC'],              // TXD1, TMR0, AIN13
  PA10:['PWM'],                              // TMR1 (X32KI)
  PA11:['PWM'],                              // TMR2 (X32KO)
  PA12:['SPI0_SCS','PWM','ADC'],             // SCS, PWM4, AIN2
  PA13:['SPI0_SCK','PWM','ADC'],             // SCK0, PWM5, AIN3
  PA14:['SPI0_MOSI','UART0_TX','ADC'],       // MOSI, TXD0_, AIN4
  PA15:['SPI0_MISO','UART0_RX','ADC'],       // MISO, RXD0_, AIN5
  PB0:['PWM','ADC'],                         // PWM6, AIN8
  PB4:['UART0_RX','PWM'],                    // RXD0, PWM7
  PB6:['PWM','ADC'],                         // PWM8, AIN9
  PB7:['UART0_TX','PWM'],                    // TXD0, PWM9
  PB10:['PWM'],                              // TMR1_ (UD-)
  PB11:['PWM'],                              // TMR2_ (UD+)
  PB12:['SPI0_SCS','UART1_RX'],              // SCS_, RXD1_
  PB13:['SPI0_SCK','UART1_TX'],              // SCK0_, TXD1_
  PB14:['SPI0_MOSI','I2C_SDA','PWM'],        // MOSI_, SDA, PWM10
  PB15:['SPI0_MISO','I2C_SCL'],              // MISO_, SCL
  PB22:['PWM','UART2_RX'],                   // TMR3, RXD2
  PB23:['UART2_TX','PWM'],                   // TXD2, PWM11
};
/* 某引脚是否支持某功能（GPIO_IN/OUT/SWIO 所有引脚均可） */
function pinSupports(name,func){
  if(func==='NONE'||func==='GPIO_IN'||func==='GPIO_OUT'||func==='SWIO') return true;
  const caps=PIN_CAPS[name]||[];
  return caps.includes(func);
}
/* 支持某功能的引脚列表 */
function pinsForFunc(func){
  return PINS.map((p,i)=>({p,i})).filter(x=>pinSupports(x.p.name,func));
}

async function refreshPins(){
  try{
    const t=await api('/api/pins');
    PINS=t.trim().split('\n').filter(Boolean).map(l=>{
      const a=l.trim().split(/\s+/);
      return {name:a[0],func:a[1],p1:+(a[2]||0),p2:+(a[3]||0),arg:+(a[4]||0),bind:+(a[5]||0)};
    });
    buildNav(); buildPages();
    return true;
  }catch(e){ toast('读取引脚失败: '+e.message,'err'); return false; }
}

/* ---------- 页面 ---------- */
function pageList(){
  return [
    {n:'系统状况', ic:'▤', render:renderOverview},
    {n:'引脚复用', ic:'⚒', render:renderPinmux, cnt:PINS.length},
    {n:'GPIO', ic:'⚙', render:renderGPIO, cnt:byFunc('GPIO_IN').length+byFunc('GPIO_OUT').length},
    {n:'ADC', ic:'◈', render:renderADC, cnt:byFunc('ADC').length},
    {n:'PWM', ic:'▤', render:renderPWM, cnt:byFunc('PWM').length},
    {n:'网络', ic:'⇄', render:renderNet},
    {n:'蓝牙', ic:'◉', render:renderBLE},
    {n:'SWIO 烧录', ic:'⬇', render:renderSWIO, cnt:byFunc('SWIO').length},
    {n:'配置', ic:'⚙', render:renderCfg},
  ];
}
let PAGES=[];
let CUR_PAGE=0;   // 当前页索引（重渲染后保持）
function buildNav(){
  PAGES=pageList();
  $('nav').innerHTML=PAGES.map((p,i)=>
    `<a onclick="showPage(${i})" id="nav-${i}" class="${i===CUR_PAGE?'on':''}"><span class=ic>${p.ic}</span>${p.n}${p.cnt!=null?`<span class=cnt>${p.cnt}</span>`:''}</a>`).join('');
}
function buildPages(){
  $('content').innerHTML=PAGES.map((p,i)=>`<div class="page ${i===CUR_PAGE?'on':''}" id="page-${i}">${p.render()}</div>`).join('');
  $('title').textContent=PAGES[CUR_PAGE].n;
  if(typeof afterRender==='function') afterRender();
}
function showPage(i){
  CUR_PAGE=i;
  document.querySelectorAll('.page').forEach((e,j)=>e.classList.toggle('on',j===i));
  document.querySelectorAll('.nav a').forEach((e,j)=>e.classList.toggle('on',j===i));
  $('title').textContent=PAGES[i].n;
}

/* ---------- 渲染：系统状况（首页） ---------- */
function renderOverview(){
  const used=PINS.filter(p=>p.func!=='NONE');
  const stats=[
    ['GPIO', byFunc('GPIO_IN').length+byFunc('GPIO_OUT').length, '⚙'],
    ['ADC', byFunc('ADC').length, '◈'],
    ['PWM', byFunc('PWM').length, '▤'],
    ['SWIO', byFunc('SWIO').length, '⬇'],
  ];
  return `<div class=grid>
    <div class=card><div class=hd><span class=ic>ℹ</span>设备信息</div><div class=bd>
      <div class=kv><span>芯片</span><b id=ov-chip>—</b></div>
      <div class=kv><span>主频</span><b id=ov-clk>—</b></div>
      <div class=kv><span>固件</span><b>CH59x Gateway</b></div>
      <div class=kv><span>芯片 ID</span><b id=ov-chipid>—</b></div>

async function refreshOverview(){
  const t=await call(null,'/api/info');
  if(t){
    const chip=t.match(/chip=(\S+)/), clk=t.match(/clk=(\d+)/);
    const cid=t.match(/chipid=(\d+)/), uid=t.match(/uid=([0-9A-Fa-f]+)/);
    if(chip) $('ov-chip').textContent=chip[1];
    if(clk) $('ov-clk').textContent=(+clk[1]/1e6).toFixed(0)+' MHz';
    if(cid) $('ov-chipid').textContent='0x'+(+cid[1]).toString(16).toUpperCase().padStart(2,'0');
    if(uid){
      // 8 字节唯一 ID，格式化为 XX:XX:XX:XX:XX:XX:XX:XX
      const s=uid[1].toUpperCase();
      $('ov-uid').textContent=s.match(/.{2}/g).join(':');
    }
  }
}
async function refreshNet(){
  const t=await call(null,'/api/info');
  if(t){
    // 匹配 IP=x.x.x.x（避免误匹配 chip=CH59x）
    const ip=t.match(/(?:^|\n)(?:IP|ip)=(\d+\.\d+\.\d+\.\d+)/);
    const rd=t.match(/rndis=(\d)/);
    if(ip) $('ov-ip').textContent=ip[1];
    if(rd) $('ov-rndis').textContent=rd[1]==='1'?'就绪':'未就绪';
  }
  const d=await call(null,'/api/dhcp');
  if(d){ const c=d.match(/clients=(\d+)/); if(c) $('ov-cli').textContent=c[1]; }
}
async function refreshBLE(){
  const t=await call(null,'/api/ble');
  if(t){
    const r=t.match(/role=(\S+)/), s=t.match(/state=(\S+)/), c=t.match(/conn=(\d)/);
    if(r) $('ov-role').textContent=r[1];
    if(s) $('ov-state').textContent=s[1];
    if(c) $('ov-conn').textContent=c[1]==='1'?'已连接':'未连接';
  }
}
function afterRender(){
  if($('ov-chip')) { refreshOverview(); refreshNet(); refreshBLE(); }
}

function pmByPin(){

/* 视图 2：按外设（手风琴卡片：每个外设一行，点击展开信号配置） */
function pmByFunc(){
  let html='';
  for(const c of TREE){
    for(const inst of c.insts){
      const id=c.cat+':'+inst.name;
      const open=PM_OPEN===id;
      const iCnt=inst.sigs.reduce((m,[f])=>m+byFunc(f).length,0);
      // 头部已配置引脚 chips（汇总该外设所有信号）
      const usedChips=inst.sigs.flatMap(([f])=>byFunc(f).map(p=>
        `<span class=chip>${p.name}<a onclick="event.stopPropagation();clearPin(${PINS.indexOf(p)})" title="移除">×</a></span>`)).join('');
      html+=`<div class="acc ${open?'open':''}">
        <div class=acc-hd onclick="pmTg('${id}')">
          <span class=caret>▶</span>
          <span class=ic>${c.ic}</span>
          <span class=nm>${inst.name}</span>
          <span class=cat>${c.cat}</span>
          <span class=pins>${usedChips}</span>
          <span class=cnt>${iCnt?iCnt+' 已用':''}</span>
        </div>`;
      if(open){
        html+='<div class=acc-bd>'+inst.sigs.map(([func,short])=>pmSigRow(func,short)).join('')+'</div>';
      }
      html+='</div>';
    }
  }
  return `<div class=pmacc>${html||'<div class=pmempty>无外设</div>'}</div>`;
}
/* 展开行内的单个信号配置：信号名 | 已用引脚 | 添加 */
function pmSigRow(func,short){
  const pins=PINS.map((p,i)=>({p,i})).filter(x=>x.p.func===func);
  const chips=pins.map(({p,i})=>
    `<span class=chip>${p.name}<a onclick="clearPin(${i})" title="移除">×</a></span>`).join('');
  const avail=PINS.map((p,i)=>({p,i}))
    .filter(x=>x.p.func==='NONE' && pinSupports(x.p.name,func));
  const opts=avail.map(({p,i})=>`<option value="${i}">${p.name}</option>`).join('');
  const add=avail.length
    ? `<select id="add-${func}"><option value="">选择引脚...</option>${opts}</select>
       <button class="btn sm" onclick="addPin('${func}')">添加</button>`
    : `<span class=muted>无可用引脚</span>`;
  // UART 信号：仅在 TX 行附加串口参数配置（TX/RX 共享同一 UART），置于 TX 行上方
  const uartExtra=isUartTxFunc(func)?uartCfgRow(func):'';
  return `${uartExtra}<div class=acc-row>
    <span class=sig><b>${short}</b><span>${func}</span></span>
    <span class=used>${chips||'<span class=muted>未配置</span>'}</span>
    <span class=add>${add}</span>
  </div>`;
}
/* 是否 UART TX 信号（UARTn_TX）——串口参数只在 TX 行显示 */
function isUartTxFunc(f){ return /^UART\d_TX$/.test(f); }
/* UART 参数配置行（模式/波特率/校验/停止位），作用于该 UART 的 TX 引脚 */
const UART_BAUDS=[9600,19200,38400,57600,115200,230400,460800,921600];
function uartCfgRow(func){
  const m=func.match(/^UART(\d)_/); if(!m) return '';
  const un=m[1];
  // 找到该 UART 的 TX 引脚配置（参数以 TX 为准）
  const tx=PINS.find(p=>p.func==='UART'+un+'_TX');
  const rx=PINS.find(p=>p.func==='UART'+un+'_RX');
  const cfg=tx||rx;
  if(!cfg) return '';
  const idx=PINS.indexOf(cfg);
  const p2=cfg.p2;                   // 编码：bit0 模式, bit1-2 校验, bit3 停止位
  const mode=p2&1;
  const parity=(p2>>1)&3;
  const stop=(p2>>3)&1;
  const baudIdx=cfg.arg;             // 波特率档位
  const bind=cfg.bind||0;            // CDC 绑定号（0=自动/固定）
  const baudOpts=UART_BAUDS.map((b,i)=>`<option value="${i}" ${i===baudIdx?'selected':''}>${b}</option>`).join('');
  // CDC 绑定下拉（动态绑定模式有效；固定映射时后端忽略）
  const bindOpts=[[0,'自动'],[1,'CDC-B'],[2,'CDC-C'],[3,'CDC-D']]
    .map(([v,n])=>`<option value="${v}" ${v===bind?'selected':''}>${n}</option>`).join('');
  return `<div class=uartcfg>
    <span class=uc-label>串口参数</span>
    <label>模式 <select id="um-${un}">
      <option value="0" ${mode===0?'selected':''}>CDC 转发</option>
      <option value="1" ${mode===1?'selected':''}>帧模式</option>
    </select></label>
    <label>波特率 <select id="ub-${un}">${baudOpts}</select></label>
    <label>校验 <select id="up-${un}">
      <option value="0" ${parity===0?'selected':''}>无</option>
      <option value="1" ${parity===1?'selected':''}>奇</option>
      <option value="2" ${parity===2?'selected':''}>偶</option>
    </select></label>
    <label>停止位 <select id="us-${un}">
      <option value="0" ${stop===0?'selected':''}>1</option>
      <option value="1" ${stop===1?'selected':''}>2</option>
    </select></label>
    <label>CDC 绑定 <select id="uk-${un}">${bindOpts}</select></label>
    <button class="btn sm" onclick="applyUart(${idx},'${un}')">应用</button>
  </div>`;
}
async function applyUart(idx,un){
  const mode=+V('um-'+un), baud=+V('ub-'+un), parity=+V('up-'+un), stop=+V('us-'+un), bind=+V('uk-'+un);
  // p2 编码：bit0 模式, bit1-2 校验, bit3 停止位
  const p2=(mode&1)|((parity&3)<<1)|((stop&1)<<3);
  const f=PINS[idx].func;
  await call(null,`/api/pin?pin=${idx}&func=${f}&p2=${p2}&arg=${baud}&bind=${bind}`,'POST');
  toast('串口参数已应用','ok'); await refreshPins();
}

/* 导出配置为 JSON 文件下载 */
function exportCfg(){
  const data={ chip:V('host'), version:1, ts:new Date().toISOString(),
    pins:PINS.map(p=>({name:p.name, func:p.func, p1:p.p1, p2:p.p2, arg:p.arg})) };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='gateway-pinmux-'+Date.now()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  $('out-io').textContent='已导出 '+data.pins.filter(p=>p.func!=='NONE').length+' 条配置';
  toast('已导出配置','ok');
}
/* 导入 JSON 配置：逐条写入并保存 */
async function importCfg(input){
  const file=input.files[0]; if(!file) return;
  const out=$('out-io');
  try{
    const data=JSON.parse(await file.text());
    const pins=data.pins||data;   // 兼容纯数组格式
    if(!Array.isArray(pins)) throw new Error('格式错误：缺少 pins 数组');
    out.textContent='导入中...';
    let n=0;
    for(const p of pins){
      if(!p.func||p.func==='NONE') continue;
      const i=PINS.findIndex(x=>x.name===p.name);
      if(i<0) continue;
      await call(null,`/api/pin?pin=${i}&func=${p.func}&p1=${p.p1||0}&p2=${p.p2||0}&arg=${p.arg||0}`,'POST');
      n++;
    }
    await refreshPins();
    out.textContent='已导入 '+n+' 条配置';
    toast('已导入 '+n+' 条配置','ok');
  }catch(e){
    out.textContent='导入失败: '+e.message;
    toast('导入失败','err');
  }
  input.value='';   // 允许重复导入同一文件
}

function emptyCard(title,ic,msg){
  return `<div class=card><div class=hd><span class=ic>${ic}</span>${title}</div><div class=bd><div class=empty>${msg}</div></div></div>`;
}
