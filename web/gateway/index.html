<!doctype html>
<html lang=zh>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>CH59x Gateway · 控制台</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#111827; --panel2:#1a2234; --border:#1f2a3d;
  --fg:#e6edf6; --muted:#8b9bb4; --accent:#3b82f6; --accent-h:#60a5fa;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --radius:12px; --shadow:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--fg); overflow:hidden;
}
.app{display:grid; grid-template-columns:220px 1fr; height:100vh}
.side{
  background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:16px 12px; gap:4px;
}
.brand{display:flex; align-items:center; gap:10px; padding:8px 10px 18px; font-weight:700; font-size:15px}
.brand .logo{
  width:28px; height:28px; border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);
  display:grid; place-items:center; font-size:15px;
}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  color:var(--muted); text-decoration:none; font-size:13.5px; cursor:pointer;
  transition:background .15s,color .15s;
}
.nav a:hover{background:var(--panel2); color:var(--fg)}
.nav a.on{background:var(--accent); color:#fff}
.nav a .ic{width:16px; text-align:center; opacity:.9}
.side .foot{margin-top:auto; padding:10px; font-size:11px; color:var(--muted); border-top:1px solid var(--border)}
.main{display:flex; flex-direction:column; overflow:hidden}
.top{
  display:flex; align-items:center; gap:12px; padding:12px 20px;
  background:var(--panel); border-bottom:1px solid var(--border);
}
.top h1{font-size:15px; margin:0; font-weight:600}
.top .sp{flex:1}
.host{
  display:flex; align-items:center; gap:6px; background:var(--panel2);
  border:1px solid var(--border); border-radius:8px; padding:4px 8px;
}
.host input{
  background:transparent; border:0; color:var(--fg); font-size:13px;
  width:150px; outline:0; font-family:ui-monospace,monospace;
}
.status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s}
.dot.on{background:var(--ok); box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--err)}
.dot.wait{background:var(--warn); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.content{flex:1; overflow-y:auto; padding:20px}
.page{display:none; animation:fade .2s}
.page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(6px)}}
.grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.card .hd{
  display:flex; align-items:center; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--border); font-weight:600; font-size:13px;
}
.card .hd .ic{color:var(--accent); font-size:15px}
.card .bd{padding:16px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.row:last-child{margin-bottom:0}
label{font-size:12px; color:var(--muted); min-width:32px}
input[type=text],input[type=number],input:not([type]){
  background:var(--bg); color:var(--fg); border:1px solid var(--border);
  border-radius:8px; padding:7px 10px; font-size:13px; width:90px; outline:0;
  transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.15)}
input[type=file]{font-size:12px; color:var(--muted); width:auto}
.btn{
  display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff;
  border:0; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:500;
  cursor:pointer; transition:background .15s,transform .08s;
}
.btn:hover{background:var(--accent-h)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2); color:var(--fg); border:1px solid var(--border)}
.btn.ghost:hover{background:var(--border)}
.btn.danger{background:var(--err)}
.out{
  background:#070b14; border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; margin-top:12px; font:12px/1.5 ui-monospace,'Cascadia Code',Consolas,monospace;
  color:#7dd3fc; white-space:pre-wrap; word-break:break-word; min-height:22px;
  max-height:200px; overflow:auto;
}
.out.err{color:#fca5a5}
#toasts{position:fixed; top:16px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:100}
.toast{
  background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:8px; padding:10px 14px; font-size:13px; box-shadow:var(--shadow);
  animation:slide .25s; max-width:320px;
}
.toast.err{border-left-color:var(--err)}
.toast.ok{border-left-color:var(--ok)}
@keyframes slide{from{opacity:0; transform:translateX(20px)}}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#2d3a52}
@media(max-width:720px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .host input{width:110px}
}
</style>
</head>
<body>
<div class=app>
  <aside class=side>
    <div class=brand><span class=logo>⚡</span>CH59x Gateway</div>
    <nav class=nav id=nav></nav>
    <div class=foot>WCH RISC-V · BLE + USB + LWIP</div>
  </aside>
  <div class=main>
    <div class=top>
      <h1 id=title>控制台</h1>
      <span class=sp></span>
      <div class=host>
        <span style="font-size:12px;color:var(--muted)">设备</span>
        <input id=host value="http://192.168.7.1" spellcheck=false>
      </div>
      <button class="btn ghost" onclick=connect()>连接</button>
      <div class=status><span class="dot" id=dot></span><span id=statustxt>未连接</span></div>
    </div>
    <div class=content id=content></div>
  </div>
</div>
<div id=toasts></div>

<script>
const $=id=>document.getElementById(id);
const V=id=>$(id).value;

const H=()=>{
  const q=new URLSearchParams(location.search).get('host');
  if(q){localStorage.setItem('gw_host',q); return q.replace(/\/$/,'')}
  return (localStorage.getItem('gw_host')||$('host').value||'http://192.168.7.1').replace(/\/$/,'');
};
function setStatus(s){
  $('dot').className='dot '+(s==='on'?'on':s==='off'?'off':'wait');
  $('statustxt').textContent=s==='on'?'已连接':s==='off'?'连接失败':'连接中…';
}
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300)},3000);
}
async function api(path,method,body){
  setStatus('wait');
  const r=await fetch(H()+path,method?{method,body}:undefined);
  const t=await r.text();
  setStatus('on');
  return t;
}
async function call(outId,path,method){
  try{
    const t=await api(path,method);
    $(outId).textContent=t; $(outId).classList.remove('err');
  }catch(e){
    $(outId).textContent='错误: '+e.message; $(outId).classList.add('err');
    setStatus('off'); toast('请求失败: '+e.message,'err');
  }
}
function connect(){
  localStorage.setItem('gw_host',V('host').replace(/\/$/,''));
  call('out-info','/api/info').then(()=>toast('已连接设备','ok'));
}

/* 页面：[组名, 图标, [卡片...]]
   卡片: {t:标题, ic:图标, in:[[标签,id,默认值]], b:[[输出区,URL,标签,POST?]], out:输出区, extra} */
const PAGES=[
 {n:'概览', ic:'▦', cards:[
   {t:'系统信息', ic:'ℹ', out:'out-info', b:[['out-info','/api/info','刷新']]},
   {t:'引脚复用', ic:'⚙', out:'out-pins', b:[['out-pins','/api/pins','列出']]},
 ]},
 {n:'GPIO / ADC', ic:'⚙', cards:[
   {t:'GPIO 控制', ic:'⚙', in:[['引脚','gp','0']], out:'out-gpio',
    b:[['out-gpio','/api/gpio?pin=$gp','读取'],['out-gpio','/api/gpio?pin=$gp&val=1','置 1',1],['out-gpio','/api/gpio?pin=$gp&val=0','置 0',1]]},
   {t:'ADC 采集', ic:'◈', in:[['通道','ac','0']], out:'out-adc',
    b:[['out-adc','/api/adc?ch=$ac','读取']]},
 ]},
 {n:'网络', ic:'⇄', cards:[
   {t:'路由表', ic:'⇄', in:[['目标','rd','0'],['掩码','rm','0'],['通道','rc','0']], out:'out-route',
    b:[['out-route','/api/route/add?dest=$rd&mask=$rm&ch=$rc','添加',1],['out-route','/api/route/del?dest=$rd&mask=$rm','删除',1],['out-route','/api/routes','列出']]},
   {t:'DHCP 服务器', ic:'⊞', in:[['IP','di','192.168.7.2'],['掩码','dm','255.255.255.0']], out:'out-dhcp',
    b:[['out-dhcp','/api/dhcp?ip=$di&mask=$dm','设置',1],['out-dhcp','/api/dhcp','状态']]},
 ]},
 {n:'蓝牙', ic:'◉', cards:[
   {t:'BLE 状态', ic:'◉', out:'out-ble', b:[['out-ble','/api/ble','查询']]},
 ]},
 {n:'SWIO 烧录', ic:'⬇', cards:[
   {t:'SWIO 固件烧录', ic:'⬇', in:[['引脚','sp','0']], out:'out-swio',
    b:[['out-swio','/api/swio?pin=$sp','设引脚',1],['out-swio','/api/swio/handshake','握手'],['out-swio','/api/swio','进度']],
    extra:'swio'},
 ]},
 {n:'配置', ic:'⚒', cards:[
   {t:'配置管理', ic:'⚒', out:'out-cfg',
    b:[['out-cfg','/api/save','保存',1],['out-cfg','/api/load','加载',1]]},
 ]},
];

function buildNav(){
  $('nav').innerHTML=PAGES.map((p,i)=>
    `<a onclick="showPage(${i})" id="nav-${i}" class="${i===0?'on':''}"><span class=ic>${p.ic}</span>${p.n}</a>`
  ).join('');
}
function cardHTML(c){
  let h=`<div class=card><div class=hd><span class=ic>${c.ic||'•'}</span>${c.t}</div><div class=bd>`;
  if(c.in) h+=`<div class=row>${c.in.map(([l,id,v])=>`<label>${l}</label><input id=${id} value="${v}">`).join('')}</div>`;
  if(c.b) h+=`<div class=row>${c.b.map(([o,u,l,p])=>{
    const q=u.replace(/\$(\w+)/g,"'+V('$1')+'");
    return `<button class="btn${p?'':' ghost'}" onclick="call('${o}','${q}'${p?",'POST'":''})">${l}</button>`;
  }).join('')}</div>`;
  if(c.extra==='swio') h+=`<div class=row><label>地址</label><input id=sa value="0x08000000"><input type=file id=sf accept=.bin><button class="btn danger" onclick=flash()>烧录</button></div>`;
  h+=`<div class=out id=${c.out}>—</div></div></div>`;
  return h;
}
function buildPages(){
  $('content').innerHTML=PAGES.map((p,i)=>`
    <div class="page ${i===0?'on':''}" id="page-${i}">
      <div class=grid>${p.cards.map(c=>cardHTML(c)).join('')}</div>
    </div>`).join('');
}
function showPage(i){
  document.querySelectorAll('.page').forEach((e,j)=>e.classList.toggle('on',j===i));
  document.querySelectorAll('.nav a').forEach((e,j)=>e.classList.toggle('on',j===i));
  $('title').textContent=PAGES[i].n;
}
async function flash(){
  const f=$('sf').files[0];
  if(!f){toast('请先选择固件文件','err'); return}
  const out=$('out-swio');
  out.textContent=`上传中 ${f.size} 字节…`;
  try{
    setStatus('wait');
    const r=await fetch(H()+'/api/swio/flash?addr='+V('sa'),{method:'POST',body:f});
    const t=await r.text();
    out.textContent=t; setStatus('on');
    toast(t.startsWith('OK')?'烧录成功':'烧录失败', t.startsWith('OK')?'ok':'err');
    call('out-swio','/api/swio');
  }catch(e){
    out.textContent='错误: '+e.message; setStatus('off'); toast('烧录失败','err');
  }
}

buildNav(); buildPages();
$('host').value=H();
call('out-info','/api/info');
</script>
</body>
</html>
