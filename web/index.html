<!doctype html>
<html lang=zh>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>CHxxx · Web UI</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#111827; --panel2:#1a2234; --border:#1f2a3d;
  --fg:#e6edf6; --muted:#8b9bb4; --accent:#3b82f6; --accent-h:#60a5fa;
  --shadow:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#1e1b4b,var(--bg));
  color:var(--fg);
}
header{padding:56px 24px 32px; text-align:center}
header .logo{
  width:56px; height:56px; margin:0 auto 16px; border-radius:16px;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);
  display:grid; place-items:center; font-size:28px;
  box-shadow:0 8px 32px rgba(59,130,246,.4);
}
header h1{margin:0 0 8px; font-size:28px; font-weight:700; letter-spacing:-.5px}
header p{margin:0; color:var(--muted); font-size:14px}
.wrap{padding:0 24px 56px; max-width:1100px; margin:0 auto}
.grid{display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:24px; box-shadow:var(--shadow); text-decoration:none; color:inherit;
  transition:border-color .2s,transform .2s; display:block;
}
.card:hover{border-color:var(--accent); transform:translateY(-4px)}
.card .ic{font-size:26px; margin-bottom:12px}
.card h2{margin:0 0 6px; font-size:17px; color:var(--fg)}
.card p{margin:0 0 16px; color:var(--muted); font-size:13px; line-height:1.5}
.card .go{
  display:inline-flex; align-items:center; gap:6px; color:var(--accent);
  font-size:13px; font-weight:500;
}
footer{text-align:center; padding:24px; color:var(--muted); font-size:12px; border-top:1px solid var(--border)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class=logo>⚡</div>
  <h1>CHxxx Web UI</h1>
  <p>WCH RISC-V 网关 / 示例项目控制台</p>
</header>
<div class=wrap>
  <div class=grid>
    <a class=card href="gateway/index.html">
      <div class=ic>🛰️</div>
      <h2>Gateway</h2>
      <p>CH591 / CH592 多功能网关：GPIO、ADC、网络路由、DHCP、BLE、SWIO 固件烧录。</p>
      <span class=go>打开控制台 →</span>
    </a>
  </div>
</div>
<footer>
  <a href="https://github.com/hvhghv/CHxxx">GitHub</a> · 基于 CH5xx / CH32V003 Lite SDK
</footer>
</body>
</html>
