<!doctype html>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>CHxxx Web UI</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;margin:0;background:linear-gradient(160deg,#0f172a,#1e1b4b);color:#e2e8f0;min-height:100vh}
header{padding:24px 20px;text-align:center;border-bottom:1px solid #334155}
header h1{margin:0 0 6px;font-size:22px}
header p{margin:0;color:#94a3b8;font-size:13px}
.w{padding:24px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));max-width:1200px;margin:0 auto}
.c{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;box-shadow:0 4px 16px #00000040;transition:border-color .2s,transform .2s}
.c:hover{border-color:#38bdf8;transform:translateY(-3px)}
.c h2{margin:0 0 8px;font-size:16px;color:#38bdf8}
.c p{margin:0 0 14px;color:#94a3b8;font-size:13px}
.c a{display:inline-block;background:#0ea5e9;color:#fff;text-decoration:none;padding:8px 16px;border-radius:7px;font-size:13px}
.c a:hover{background:#38bdf8}
</style>
<header><h1>CHxxx Web UI</h1><p>WCH RISC-V 网关 / 示例项目前端</p></header>
<div class=w>
  <div class=c><h2>Gateway</h2><p>CH591/CH592 多功能网关控制面板</p><a href="gateway/">打开</a></div>
</div>
